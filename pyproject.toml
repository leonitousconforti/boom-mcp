[project]
name = "boom-mcp"
version = "0.1.0"
description = "An MCP server for the BOOM alert broker, through the Babamul API"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx",
    "numpy",
    "astropy",
    "matplotlib",
    "python-dotenv",
    "starlette",
    "uvicorn",
]

[project.urls]
Homepage = "https://github.com/leonitousconforti/boom-mcp"

[project.optional-dependencies]
agent = ["anthropic>=2.6,<3"]

[project.scripts]
boom-mcp = "boom_mcp.server:main"

[dependency-groups]
dev = [
    "fastavro>=1.13.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boom_mcp"]
